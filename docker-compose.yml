version: '3.8'

services:
  # PostgreSQL with PGVector
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: cert_validation
      POSTGRES_USER: certuser
      POSTGRES_PASSWORD: certpass123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Application
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://certuser:certpass123@postgres:5432/cert_validation
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./gcp-key.json:/app/gcp-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
